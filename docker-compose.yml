services:
  backend:
    build: ./backend
    container_name: startup-backend
    ports:
      - "8000:8000"
    volumes:
      - ./model:/model  # Maps your local 'model' folder to '/model' in container
    restart: always

  frontend:
    build: ./frontend
    container_name: startup-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/predict
    depends_on:
      - backend